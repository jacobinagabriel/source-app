[project]
name = "source-app"
version = "0.1.0"
description = "Minimal OLTP traffic generator for PostgreSQL, used as a CDC source"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "faker",
    "pydantic-settings",
    "psycopg2-binary",
    "sqlalchemy>=2.0",
]

[project.scripts]
source-app = "source_app.cli:main"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/source_app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is left to ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]
